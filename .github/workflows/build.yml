name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip setuptools
          pip install buildozer "cython<3.0.0"

      - name: Pre-download recipe dependencies (bypass 502 Savannah errors)
        run: |
          mkdir -p ~/.buildozer/cache
          mkdir -p ~/.buildozer/cache/freetype
          # Download freetype from GNU reliable CDN mirror
          curl -sSL "https://ftpmirror.gnu.org/freetype/freetype-2.14.1.tar.gz" -o ~/.buildozer/cache/freetype-2.14.1.tar.gz
          cp ~/.buildozer/cache/freetype-2.14.1.tar.gz ~/.buildozer/cache/freetype/

      - name: Build APK with Buildozer
        run: |
          # Automatically accept SDK licenses and build debug APK
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
