name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      # PyPI के लिए मिरर – तू चाहे तो इसे बदल सकता है (नीचे ऑप्शन दिए हैं)
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_TRUSTED_HOST: pypi.org

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip autoconf libtool pkg-config
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure Android NDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          if [ -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653" ]; then
            ln -sfn $ANDROID_SDK_ROOT/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
            touch ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
            echo "NDK 25b symlinked successfully"
          else
            echo "NDK not pre-installed, Buildozer will download it"
          fi

      - name: Setup Android SDK for Buildozer
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILD_SDK"
          cp -r "$ANDROID_SDK_ROOT/cmdline-tools" "$BUILD_SDK/"
          mkdir -p "$BUILD_SDK/tools/bin"
          ln -sf "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILD_SDK/tools/bin/sdkmanager"
          yes | "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILD_SDK" --licenses
          "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILD_SDK" \
            "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"

      # 👇 यह स्टेप हर बिल्ड से पहले पिछला अधूरा डाउनलोड साफ करेगा
      - name: Clean previous build artifacts
        run: |
          rm -rf ~/.buildozer/android/platform/build-*
          rm -rf ~/.buildozer/android/platform/dist
          echo "Build storage cleaned"

      - name: Build APK with Buildozer
        # -v हटा दिया ताकि फालतू लॉग न दिखे और एरर साफ दिखे
        run: buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
