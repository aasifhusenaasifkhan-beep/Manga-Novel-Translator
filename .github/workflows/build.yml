name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Buildozer & p4a downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            libjpeg-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Build APK with Auto-Retry
        run: |
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          
          # Retry up to 3 times if external download returns 502
          n=0
          until [ "$n" -ge 3 ]
          do
             buildozer -v android debug && break
             n=$((n+1))
             echo "Retrying build (Attempt $n) due to network error..."
             sleep 10
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
