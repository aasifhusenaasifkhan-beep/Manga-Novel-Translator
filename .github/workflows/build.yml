name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip openjdk-17-jdk autoconf libtool pkg-config
          pip install --upgrade pip
          pip install buildozer cython

      # Clears corrupted cached archives and conditionally symlinks the NDK
      - name: Configure Android NDK Workspace
        run: |
          mkdir -p ~/.buildozer/android/platform
          
          # Delete any cached corrupted zip files to guarantee clean extraction fallback
          rm -f ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          
          # Use local system NDK if available on the runner, otherwise fall back cleanly
          if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
            echo "Pre-installed NDK 25b detected. Symlinking..."
            ln -sfn /usr/local/lib/android/sdk/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
          else
            echo "Pre-installed NDK 25b not found on this image. Buildozer will execute a fresh download."
          fi

      # Re-establish SDK Tools layout
      - name: Setup Android SDK Tools Link
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/tools/
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      # Pre-seed Android Licenses
      - name: Pre-accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo -e "8933bad161ad51b7226c3f2da3197ca9575b90da\n2512d1a1d1d407da7495b3eab4b13a1a9e52512d\nd56f5187479451eabf01fb74c5023d612d9739a4" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7cce6ee5cdb2b3434c5474cf4e53" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
