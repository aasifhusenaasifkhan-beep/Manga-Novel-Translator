name: Build Android APK (Savannah Patch)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip \
            curl \
            gettext

      - name: Install Exact Compatible Python Modules
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<69.0.0" "cython==0.29.36" "buildozer==1.5.0" "virtualenv==20.25.0"

      - name: Pre-clone p4a & Patch Broken Savannah URLs to GNU Mirror
        run: |
          # 1. Create buildozer platform folder
          mkdir -p ~/.buildozer/android/platform

          # 2. Clone python-for-android
          git clone --depth 1 https://github.com/kivy/python-for-android.git ~/.buildozer/android/platform/python-for-android

          # 3. Patch p4a recipes to replace dead savannah.gnu.org with ftpmirror.gnu.org
          sed -i 's|download.savannah.gnu.org|ftpmirror.gnu.org|g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py
          sed -i 's|download.savannah.gnu.org|ftpmirror.gnu.org|g' ~/.buildozer/android/platform/python-for-android/pythonforandroid/recipes/*/__init__.py || true

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
