name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_TRUSTED_HOST: pypi.org

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip autoconf libtool pkg-config
          pip install --upgrade pip
          pip install buildozer cython

      - name: Configure Android NDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          if [ -d "$ANDROID_SDK_ROOT/ndk/25.2.9519653" ]; then
            ln -sfn $ANDROID_SDK_ROOT/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
            touch ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
            echo "NDK 25b symlinked successfully"
          else
            echo "NDK not pre-installed, Buildozer will download it"
          fi

      - name: Setup Android SDK for Buildozer
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILD_SDK"
          cp -r "$ANDROID_SDK_ROOT/cmdline-tools" "$BUILD_SDK/"
          mkdir -p "$BUILD_SDK/tools/bin"
          ln -sf "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" "$BUILD_SDK/tools/bin/sdkmanager"
          yes | "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILD_SDK" --licenses
          "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILD_SDK" \
            "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          echo "ANDROID_SDK_ROOT=$BUILD_SDK" >> "$GITHUB_ENV"

      - name: Clean previous build artifacts
        run: |
          rm -rf $GITHUB_WORKSPACE/.buildozer/android/platform/build-*
          rm -rf $GITHUB_WORKSPACE/.buildozer/android/platform/dist
          echo "Build storage cleaned"

      - name: Pre-download freetype to correct storage-dir
        run: |
          # python-for-android जिस storage-dir का उपयोग करेगा (arch के अनुसार)
          STORAGE_DIR="$GITHUB_WORKSPACE/.buildozer/android/platform/build-armeabi-v7a_arm64-v8a"
          PACKAGES_DIR="$STORAGE_DIR/packages/freetype"
          mkdir -p "$PACKAGES_DIR"
          
          echo "Downloading freetype-2.14.1.tar.gz from SourceForge mirror..."
          wget -q --show-progress \
            --user-agent="Mozilla/5.0" \
            -O "$PACKAGES_DIR/freetype-2.14.1.tar.gz" \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.gz" \
          && echo "Download successful" || echo "Download failed, Buildozer will try default"
          
          # सुनिश्चित करें कि p4a फ़ाइल को पहचाने (marker फ़ाइल भी बनाएं)
          touch "$PACKAGES_DIR/.mark-freetype-2.14.1.tar.gz"
        shell: bash

      - name: Build APK with Buildozer
        run: buildozer android debug

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
