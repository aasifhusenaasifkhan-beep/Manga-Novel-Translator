name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip autoconf libtool pkg-config
          pip install --upgrade pip
          pip install buildozer cython

      # 👇 ये स्टेप NDK को सिमलिंक करेगा (टाइपो ठीक)
      - name: Configure Android NDK Workspace
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -f ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          
          if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
            echo "Pre-installed NDK 25b detected. Symlinking..."
            ln -sfn /usr/local/lib/android/sdk/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
            touch ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
          else
            echo "Pre-installed NDK 25b not found. Buildozer will download cleanly."
          fi

      # 👇 SDK के लाइसेंस एक्सेप्ट करने का आसान तरीका
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
