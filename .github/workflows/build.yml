name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FIX (added): without this, every single run re-downloads the Android
      # SDK components and pip packages from scratch — slow, and adds an
      # extra chance of a network hiccup failing the whole build.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip openjdk-17-jdk autoconf libtool pkg-config
          pip install --upgrade pip
          # FIX: cython==0.29.33 was pinned very old — known to fail against
          # newer buildozer/python-for-android toolchains. Pinning to
          # "<3" instead avoids the breaking Cython 3.x changes (which many
          # p4a recipes still don't support) while staying on a recent,
          # working 0.29.x release.
          pip install buildozer "cython<3,>=0.29.36"

      - name: Setup Android SDK Tools Link
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/tools/
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"

      - name: Build APK with Buildozer
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_NDK: ""
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
