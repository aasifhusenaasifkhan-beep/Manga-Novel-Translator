name: Build Android APK (Rock Solid Toolchain)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.12'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ccache \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            zip \
            unzip \
            curl \
            gettext

      - name: Install Exact Compatible Python Modules
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<69.0.0" "cython==0.29.36" "buildozer==1.5.0" "virtualenv==20.25.0"

      - name: Pre-inject All C-Library Recipes (Prevent 502/403 Download Errors)
        run: |
          # Create all target package directories for python-for-android
          mkdir -p ~/.buildozer/android/packages/freetype
          mkdir -p ~/.buildozer/android/packages/jpeg
          mkdir -p ~/.buildozer/android/packages/png
          mkdir -p ~/.buildozer/cache

          # 1. Inject Freetype
          curl -fL "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz" -o ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz || true
          cp ~/.buildozer/android/packages/freetype/freetype-2.14.1.tar.gz ~/.buildozer/cache/ 2>/dev/null || true

          # 2. Inject LibJPEG
          curl -fL "https://www.ijg.org/files/jpegsrc.v9e.tar.gz" -o ~/.buildozer/android/packages/jpeg/jpegsrc.v9e.tar.gz || true

          # 3. Inject LibPNG
          curl -fL "https://downloads.sourceforge.net/project/libpng/libpng16/1.6.43/libpng-1.6.43.tar.gz" -o ~/.buildozer/android/packages/png/libpng-1.6.43.tar.gz || true

      - name: Build APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
