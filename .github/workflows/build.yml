name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Buildozer Global Directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y ccache git libffi-dev libssl-dev python3-dev build-essential \
            libltdl-dev libstdc++6 zlib1g zip unzip openjdk-17-jdk autoconf libtool pkg-config
          pip install --upgrade pip
          pip install buildozer cython

      # Step 1: Symlink pre-installed NDK 25b to prevent heavy NDK downloads
      - name: Configure Android NDK Workspace
        run: |
          mkdir -p ~/.buildozer/android/platform
          rm -f ~/.buildozer/android/platform/android-ndk-r25b-linux.zip
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b
          
          if [ -d "/usr/local/lib/android/sdk/ndk/25.2.9519653" ]; then
            echo "Pre-installed NDK 25b detected. Symlinking..."
            ln -sfn /usr/local/lib/android/sdk/ndk/25.2.9519653 ~/.buildozer/android/platform/android-ndk-r25b
          else
            echo "Pre-installed NDK 25b not found. Buildozer will download cleanly."
          fi

      # Step 2: Establish default tools structure & accept ALL licenses dynamically
      - name: Setup Android SDK and Accept Licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools
          cp -r $ANDROID_HOME/cmdline-tools/latest/* ~/.buildozer/android/platform/android-sdk/tools/
          
          # Install target platforms
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk "build-tools;33.0.2" "platforms;android-33" "platform-tools"
          
          # Dynamically accept every license (including SDK terms, preview, and build-tools 37+)
          yes | ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTranslator-APK
          path: bin/*.apk
